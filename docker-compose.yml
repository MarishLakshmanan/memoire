services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: memoire
      POSTGRES_PASSWORD: memoire
      POSTGRES_DB: memoire
    ports:
      # 5433, not 5432 — another project's Postgres container already holds 5432 on this machine.
      - "5433:5432"
    volumes:
      - memoire_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memoire"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  memoire_pg_data:
