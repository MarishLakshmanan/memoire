[project]
name = "memoire"
version = "0.1.0"
description = "A shared notes store for AI chat sessions, exposed to AI clients as an MCP server."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "mcp>=2.2.0",
    "pyjwt[crypto]>=2.15.1",
    "python-dotenv>=1.2.3",
    "sqlmodel>=0.0.47",
    "uuid6>=2025.0.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "pre-commit>=4.6.2",
    "pyright>=1.1.414",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.bandit]
exclude_dirs = ["migrations", ".venv", "frontend"]
