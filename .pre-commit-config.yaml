# See https://pre-commit.com for general usage.
# Backend hooks run via `uv run` (uv.lock-pinned versions); frontend hooks run via
# `npm --prefix frontend` (package-lock.json-pinned versions). No separate version
# pins to keep in sync here.

default_language_version:
  python: python3.12

repos:
  - repo: local
    hooks:
      - id: ruff-lint
        name: ruff lint (app, db, migrations)
        entry: uv run ruff check --fix
        language: system
        types: [python]
        files: ^(app|db|migrations)/

      - id: ruff-format
        name: ruff format (app, db, migrations)
        entry: uv run ruff format
        language: system
        types: [python]
        files: ^(app|db|migrations)/

      - id: pyright
        name: pyright (app, db)
        entry: uv run pyright
        language: system
        types: [python]
        files: ^(app|db)/
        pass_filenames: false

      - id: bandit
        name: bandit security lint (app, db)
        entry: uv run bandit -c pyproject.toml -r app db
        language: system
        types: [python]
        files: ^(app|db)/
        pass_filenames: false

      - id: frontend-eslint
        name: eslint (frontend)
        entry: npm --prefix frontend run lint
        language: system
        files: ^frontend/.*\.(ts|tsx)$
        pass_filenames: false

      - id: frontend-typecheck
        name: tsc type check (frontend)
        entry: npm --prefix frontend run typecheck
        language: system
        files: ^frontend/.*\.(ts|tsx)$
        pass_filenames: false

      - id: frontend-audit
        name: npm audit --audit-level=high (frontend)
        entry: npm --prefix frontend run audit
        language: system
        files: ^frontend/package(-lock)?\.json$
        pass_filenames: false

  # Optional, easy add-on — general hygiene hooks, unrelated to the tooling above.
  # Safe to drop this block entirely if not wanted.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files
      - id: check-merge-conflict
